<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register Course</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="registerStyle.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-logo">⚡ NeuroSpark</div>
        <div class="nav-links-top">
            <a href="index.html" class="nav-item">Home</a>
            <a href="availCourses.html" class="nav-item">Courses</a>
            <a href="enrolled.html" class="nav-item">Students</a>
            <a href="register.html" class="nav-item active btn-small">Enroll</a>
        </div>
    </nav>

    <div class="container">
        <h1>Register Course</h1>
        <p>"Your journey to mastering technology starts here. Take the first step today."</p>

        <form action="http://localhost:8080/courseRegistration/enrollCourse" method="post">
            <label for="name">Enter You Name</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Enter Your Email</label>
            <input type="email" id="email" name="emailId" required>

            <label for="course">Select a Course</label>
            <select id="course" name="courseName" required>
                <option value="" disabled selected>Select a Course</option>
                <option>Java Full Stack</option>
                <option>AI</option>
                <option>Digital Marketing</option>
                <option>Cyber Security</option>
                <option>Cloud</option>
            </select>

            <button type="submit">Enroll Now</button>
        </form>

        <div class="nav-links">
            <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Home</a>
            <a href="availCourses.html" class="nav-btn"><i class="fa-solid fa-list"></i> Available Courses</a>
            <a href="enrolled.html" class="nav-btn"><i class="fa-solid fa-user-graduate"></i> Enrolled Students</a>
        </div>
    </div>

</body>

</html>
